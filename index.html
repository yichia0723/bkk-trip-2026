<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>🌿 曼谷 5 天 4 夜 2026</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --oat: #f5efe6;
            --sage-dark: #7aab70;
            --text-main: #3d3530;
            --text-soft: #7a6e65;
            --gold: #c9a96e;
            --shadow: 0 4px 20px rgba(61,53,48,0.08);
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--oat);
            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
        }
        /* 隱藏捲軸但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .active-date { background: var(--sage-dark) !important; color: white !important; }
        .itin-card { background: white; border-radius: 20px; padding: 15px; margin-bottom: 12px; box-shadow: var(--shadow); }
        .cat-tag { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: bold; }
        .cat-美食 { background: #fef3c7; color: #92400e; }
        .cat-景點 { background: #d1fae5; color: #065f46; }
        .cat-交通 { background: #e0f2fe; color: #075985; }
    </style>
</head>
<body>
    <div id="app" class="relative pb-24">
        <!-- Banner -->
        <div class="relative h-60 overflow-hidden shadow-lg">
            <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1508939232145-159c44abc327?q=80&w=1000" alt="Bangkok">
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
            <div class="absolute bottom-6 left-5 text-white">
                <h1 class="text-2xl font-bold tracking-wider">🇹🇭 曼谷熱力之旅</h1>
                <p class="text-sm opacity-80">2026.06.16 - 06.20</p>
            </div>
        </div>

        <!-- 主內容區域 -->
        <div class="bg-[#f5efe6] rounded-t-[30px] -mt-8 relative z-10 px-4 pt-6">
            
            <!-- 日期導航 -->
            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-4">
                <div v-for="(day, index) in days" :key="index" 
                     @click="currentDay = index"
                     :class="['flex-shrink-0 w-14 h-20 rounded-2xl flex flex-col items-center justify-center bg-white shadow-sm transition-all', currentDay === index ? 'active-date scale-105' : 'text-gray-400']">
                    <span class="text-xs font-bold">{{ day.week }}</span>
                    <span class="text-xl font-light">{{ day.date }}</span>
                </div>
            </div>

            <!-- 天氣 Bar -->
            <div class="bg-white/50 border border-white rounded-2xl p-4 flex items-center gap-4 mb-6">
                <i class="fas fa-sun text-yellow-500 text-3xl"></i>
                <div>
                    <div class="text-lg font-bold">34°C <span class="text-xs text-gray-500 font-normal">體感 38°C</span></div>
                    <div class="text-xs text-green-700 font-medium">晴時多雲，記得多補充水分</div>
                </div>
            </div>

            <!-- 行程列表 -->
            <div class="itinerary">
                <div v-for="(item, i) in currentItinerary" :key="i" class="itin-card border border-white/50">
                    <div class="flex justify-between items-start mb-2">
                        <span :class="['cat-tag', 'cat-' + item.category]">{{ item.category }}</span>
                        <span class="text-xs text-gray-400 font-medium">{{ item.time }}</span>
                    </div>
                    <h3 class="font-bold text-gray-800">{{ item.location }}</h3>
                    <p class="text-xs text-gray-500 mt-1">{{ item.note }}</p>
                </div>
            </div>

            <!-- 簡單支出小計 -->
            <div class="mt-4 p-4 bg-sage-dark/10 rounded-2xl border border-sage-dark/20 text-center">
                <span class="text-sm text-gray-600">預估今日支出：</span>
                <span class="text-lg font-bold text-green-800">฿ {{ dailyBudget[currentDay] }}</span>
            </div>
        </div>

        <!-- 懸浮導覽列 -->
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] bg-white/80 backdrop-blur-md h-16 rounded-full shadow-2xl flex items-center justify-around px-6 z-50">
            <button class="text-sage-dark"><i class="fas fa-map-marked-alt text-xl"></i></button>
            <button class="w-12 h-12 bg-[#7aab70] rounded-full text-white shadow-lg -mt-8 border-4 border-[#f5efe6]"><i class="fas fa-plus"></i></button>
            <button class="text-gray-400"><i class="fas fa-wallet text-xl"></i></button>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    currentDay: 0,
                    days: [
                        { date: '16', week: 'TUE', itinerary: [
                            { time: '14:30', category: '交通', location: '抵達曼谷 BKK 機場', note: '領取 SIM 卡與換匯' },
                            { time: '16:00', category: '景點', location: '入住飯店 Eastin Grand', note: '無邊際泳池拍美照' },
                            { time: '19:00', category: '美食', location: '喬德夜市 Jodd Fairs', note: '必吃火山排骨' }
                        ]},
                        { date: '17', week: 'WED', itinerary: [
                            { time: '10:00', category: '景點', location: '鄭王廟', note: '租借泰服體驗' },
                            { time: '13:00', category: '美食', location: '榮泰米粉湯', note: '米其林推薦小吃' }
                        ]},
                        { date: '18', week: 'THU', itinerary: [] },
                        { date: '19', week: 'FRI', itinerary: [] },
                        { date: '20', week: 'SAT', itinerary: [] }
                    ],
                    dailyBudget: [1500, 2200, 1800, 3500, 1000]
                }
            },
            computed: {
                currentItinerary() {
                    return this.days[this.currentDay].itinerary;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
